name: Restyle Profile Studio

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Apply the site-native Profile Studio styling to main"
        required: true
        default: "yes"

permissions:
  contents: write

jobs:
  restyle-profile-studio:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm Profile Studio is installed
        shell: bash
        run: |
          set -euo pipefail
          test -f js/pages/Profile.js
          test -f css/pages/profile.css
          if ! grep -q 'pc-customizer' js/pages/Profile.js; then
            echo "Profile Studio is not installed yet. Run Install Profile Studio first, then rerun this workflow."
            exit 1
          fi

      - name: Apply site-native styling
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import sys

          path = Path("css/pages/profile.css")
          css = path.read_text(encoding="utf-8")
          marker = "/* Profile Studio: Suberboys native styling v2 */"
          if marker in css:
              print("Profile Studio styling is already applied.")
              sys.exit(0)
          addition = base64.b64decode("").decode("utf-8")
          path.write_text(css.rstrip() + "\n\n" + addition, encoding="utf-8")
          print("Added site-native Profile Studio styling.")
          PYCODE

      - name: Validate diff
        run: git diff --check

      - name: Commit styling update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- css/pages/profile.css; then
            echo "No styling changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/pages/profile.css
          git commit -m "Match Profile Studio styling to site theme"
          git push origin HEAD:main
