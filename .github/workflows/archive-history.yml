

name: Archive level list history

on:
  push:
    branches:
      - main
    paths:
      - data/_list.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save snapshot and update timeline
        env:
          SNAPSHOT_SHA: ${{ github.sha }}
          SNAPSHOT_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const source = 'data/_list.json';
          const snapshotDir = 'archive/snapshots';
          const indexFile = 'archive/index.json';
          const changesFile = 'archive/changes.json';

          const levels = JSON.parse(fs.readFileSync(source, 'utf8'));
          if (!Array.isArray(levels)) {
            throw new Error('data/_list.json must contain a JSON array');
          }

          const sha = process.env.SNAPSHOT_SHA;
          const date = process.env.SNAPSHOT_DATE
            ? new Date(process.env.SNAPSHOT_DATE)
            : new Date();

          if (Number.isNaN(date.getTime())) {
            throw new Error('Could not determine snapshot date');
          }

          const dateText = date.toISOString().slice(0, 10);
          const file = `${dateText}-${sha.slice(0, 7)}.json`;

          fs.mkdirSync(snapshotDir, { recursive: true });

          const snapshotPath = path.join(snapshotDir, file);
          fs.writeFileSync(
            snapshotPath,
            JSON.stringify(levels, null, 2) + '\n'
          );

          const index = fs.existsSync(indexFile)
            ? JSON.parse(fs.readFileSync(indexFile, 'utf8'))
            : [];

          if (!index.some(item => item.commit === sha)) {
            index.push({
              date: date.toISOString(),
              commit: sha,
              file: `snapshots/${file}`
            });
          }

          index.sort((a, b) => a.date.localeCompare(b.date));
          fs.mkdirSync('archive', { recursive: true });
          fs.writeFileSync(indexFile, JSON.stringify(index, null, 2) + '\n');

          const changes = index.map((item, i) => {
            const current = JSON.parse(
              fs.readFileSync(path.join('archive', item.file), 'utf8')
            );
            const previous = i > 0
              ? JSON.parse(
                  fs.readFileSync(path.join('archive', index[i - 1].file), 'utf8')
                )
              : [];

            const currentSet = new Set(current);
            const previousSet = new Set(previous);

            return {
              date: item.date,
              commit: item.commit,
              added: current.filter(level => !previousSet.has(level)),
              removed: previous.filter(level => !currentSet.has(level)),
              moved: current
                .filter(level => previousSet.has(level))
                .filter(level => previous.indexOf(level) !== current.indexOf(level))
                .map(level => ({
                  level,
                  from: previous.indexOf(level),
                  to: current.indexOf(level)
                }))
            };
          });

          fs.writeFileSync(
            changesFile,
            JSON.stringify(changes, null, 2) + '\n'
          );

          console.log(`Saved ${levels.length} levels to ${snapshotPath}`);
          NODE

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update historical level archive"
            git push
          fi
